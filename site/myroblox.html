  <svg width="88" height="88" viewBox="0 0 24 24" fill="currentColor" style="left:55%;top:78%;opacity:.06;--rot:8deg;animation:float1 9s ease-in-out 0.5s infinite"><path d="M17 4H7C3.13 4 0 7.13 0 11c0 2.76 1.58 5.15 3.88 6.38L5 20h14l1.12-2.62C22.42 16.15 24 13.76 24 11c0-3.87-3.13-7-7-7zM9 13H7v2H5v-2H3v-2h2V9h2v2h2v2zm6.5 1c-.83 0-1.5-.67-1.5-1.5S14.67 11 15.5 11s1.5.67 1.5 1.5S16.33 14 15.5 14zm2-3c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5S18.33 11 17.5 11z"/></svg>
  <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor" style="left:30%;top:88%;opacity:.05;--rot:-10deg;animation:float0 12s ease-in-out 0.3s infinite"><path d="M17 4H7C3.13 4 0 7.13 0 11c0 2.76 1.58 5.15 3.88 6.38L5 20h14l1.12-2.62C22.42 16.15 24 13.76 24 11c0-3.87-3.13-7-7-7zM9 13H7v2H5v-2H3v-2h2V9h2v2h2v2zm6.5 1c-.83 0-1.5-.67-1.5-1.5S14.67 11 15.5 11s1.5.67 1.5 1.5S16.33 14 15.5 14zm2-3c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5S18.33 11 17.5 11z"/></svg>

  <svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor" style="left:8%;top:78%;opacity:.05;--rot:12deg;animation:float2 9s ease-in-out 3.5s infinite"><path d="M19 3H5L1 9l11 12L23 9l-4-6zm-7 14.5L4.5 9.5 7.5 5h9l3 4.5L12 17.5z"/></svg>

      <svg id="icon-open" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">

<div class="page roblox-page">
  <div class="roblox-header-row">
    <h1 class="page-title" style="margin-bottom:0">My Roblox Profile</h1>
    <button class="refresh-btn" id="refresh-btn" onclick="loadProfile()">
      <svg id="refresh-icon" width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      <span id="refresh-label">Refresh</span>
    </button>
  </div>
  <div id="roblox-content"></div>
</div>

<script>
const USER_ID = "5255024681";
const USER_ID_NUM = 5255024681;

function toggleMenu() {
  const menu = document.getElementById('nav-mobile');
  const open = document.getElementById('icon-open');
  const close = document.getElementById('icon-close');
  menu.classList.toggle('open');
  open.style.display = menu.classList.contains('open') ? 'none' : 'block';
  close.style.display = menu.classList.contains('open') ? 'block' : 'none';
}

function fmtNum(n) { return n !== null && n !== undefined ? n.toLocaleString() : '—'; }

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function statusBadge(p) {
  if (!p) return '';
  const t = p.userPresenceType;
  let cls, dot, label;
  if (t === 2) {
    cls = 'status-ingame'; label = 'In Game' + (p.lastLocation ? ' · ' + p.lastLocation : '');
  } else if (t === 1) {
    cls = 'status-online'; label = 'Online';
  } else if (t === 3) {
    cls = 'status-studio'; label = 'In Studio';
  } else {
    cls = 'status-offline'; label = 'Offline';
  }
  return `<span class="status-badge ${cls}"><span class="status-dot"></span>${label}</span>`;
}

function showSkeleton() {
  document.getElementById('roblox-content').innerHTML = `
    <div style="display:flex;gap:20px;margin-bottom:1.5rem">
      <div class="skeleton" style="width:112px;height:140px;border-radius:6px;flex-shrink:0"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:10px;padding-top:4px">
        <div class="skeleton" style="height:18px;width:35%"></div>
        <div class="skeleton" style="height:13px;width:22%"></div>
        <div class="skeleton" style="height:13px;width:60%"></div>
        <div class="skeleton" style="height:12px;width:30%"></div>
      </div>
    </div>
    <div style="border-top:1px solid #f3f4f6;border-bottom:1px solid #f3f4f6;padding:1rem 0;margin-bottom:1.5rem;display:flex;gap:2rem">
      <div><div class="skeleton" style="height:11px;width:55px;margin-bottom:6px"></div><div class="skeleton" style="height:28px;width:36px"></div></div>
      <div><div class="skeleton" style="height:11px;width:55px;margin-bottom:6px"></div><div class="skeleton" style="height:28px;width:36px"></div></div>
      <div><div class="skeleton" style="height:11px;width:55px;margin-bottom:6px"></div><div class="skeleton" style="height:28px;width:36px"></div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
      ${[0,1,2,3,4].map(() => `<div><div class="skeleton" style="width:100%;aspect-ratio:1;border-radius:6px;margin-bottom:6px"></div><div class="skeleton" style="height:10px;width:80%"></div></div>`).join('')}
    </div>`;
}

function showError(msg) {
  document.getElementById('roblox-content').innerHTML = `
    <p class="error-msg">${msg}</p>
    <button class="btn-pill" onclick="loadProfile()" style="cursor:pointer;background:none">Try Again</button>`;
}

function renderGroups(groups) {
  if (!groups || groups.length === 0) return '';
  const rows = groups.map(({ group, role }) =>
    `<div class="group-row">
       <span class="group-name">${group.name}</span>
       <span class="group-role">${role?.name ?? ''}</span>
     </div>`
  ).join('');
  return `
    <p class="stat-label-sm" style="margin-bottom:10px">GROUPS</p>
    <div class="groups-list groups-bordered">${rows}</div>`;
}

function renderBadges(badges) {
  if (!badges || badges.length === 0) return '';
  const cells = badges.map(b => {
    const img = b.imageUrl
      ? `<img src="${b.imageUrl}" alt="${b.name}" class="badge-img" />`
      : `<div class="badge-img badge-placeholder"></div>`;
    return `<div class="badge-cell">${img}<p class="badge-name">${b.name}</p>${b.game ? `<p class="badge-game">${b.game}</p>` : ''}</div>`;
  }).join('');
  return `
    <p class="stat-label-sm" style="margin-bottom:10px;margin-top:1.5rem">RECENT BADGES</p>
    <div class="badges-grid">${cells}</div>`;
}

function showProfile(user, avatarUrl, counts, presence, prevNames, groups, badges) {
  const time = new Date().toLocaleTimeString();

  const avatarHtml = avatarUrl
    ? `<img class="roblox-full-avatar" src="${avatarUrl}" alt="avatar" />`
    : `<div class="roblox-full-avatar avatar-placeholder"></div>`;

  const desc = user.description
    ? `<p class="profile-desc">${user.description}</p>`
    : '';

  const prevNamesHtml = prevNames.length > 0
    ? `<div style="margin-top:1.25rem">
         <p class="stat-label-sm" style="margin-bottom:8px">PREVIOUS USERNAMES</p>
         <div class="prev-names">${prevNames.map(n => `<span class="prev-name-tag">${n}</span>`).join('')}</div>
       </div>`
    : '';

  document.getElementById('roblox-content').innerHTML = `
    <div class="roblox-grid">

      <!-- LEFT: profile card + counts + prev names -->
      <div class="roblox-left">
        <div class="roblox-profile-card">
          ${avatarHtml}
          <div style="flex:1;min-width:0">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px">
              <div class="profile-name">${user.displayName}</div>
            </div>
            ${statusBadge(presence)}
            <div class="profile-handle" style="margin-top:4px">@${user.name}</div>
            ${desc}
            <p style="font-size:0.75rem;color:#9ca3af;margin-bottom:8px;margin-top:4px">Joined ${fmtDate(user.created)}</p>
            <a class="roblox-link" href="https://www.roblox.com/users/${user.id}/profile" target="_blank" rel="noopener">
              View on Roblox →
            </a>
          </div>
        </div>

        <div class="stats-row" style="margin-top:1.25rem">
          <div class="stat-item"><div class="stat-label-sm">FRIENDS</div><div class="stat-val">${fmtNum(counts.friends)}</div></div>
          <div class="stat-item"><div class="stat-label-sm">FOLLOWERS</div><div class="stat-val">${fmtNum(counts.followers)}</div></div>
          <div class="stat-item"><div class="stat-label-sm">FOLLOWING</div><div class="stat-val">${fmtNum(counts.following)}</div></div>
        </div>

        ${prevNamesHtml}
        <p class="updated" style="margin-top:1.25rem">Updated ${time}</p>
      </div>

      <!-- RIGHT: groups + badges -->
      <div class="roblox-right">
        ${renderGroups(groups)}
        ${renderBadges(badges)}
      </div>

    </div>`;
}

async function loadProfile() {
  const btn = document.getElementById('refresh-btn');
  const label = document.getElementById('refresh-label');
  const icon = document.getElementById('refresh-icon');
  btn.disabled = true;
  icon.style.animation = 'spin 0.8s linear infinite';
  label.textContent = 'Loading…';
  showSkeleton();

  try {
    const [userR, avatarR, friendsR, followersR, followingR, presenceR, prevNamesR, groupsR, badgesR] =
      await Promise.allSettled([
        fetch(`https://users.roblox.com/v1/users/${USER_ID}`).then(r => r.ok ? r.json() : null),
        fetch(`https://thumbnails.roblox.com/v1/users/avatar?userIds=${USER_ID}&size=420x420&format=Png&isCircular=false`).then(r => r.ok ? r.json() : null),
        fetch(`https://friends.roblox.com/v1/users/${USER_ID}/friends/count`).then(r => r.ok ? r.json() : null),
        fetch(`https://friends.roblox.com/v1/users/${USER_ID}/followers/count`).then(r => r.ok ? r.json() : null),
        fetch(`https://friends.roblox.com/v1/users/${USER_ID}/followings/count`).then(r => r.ok ? r.json() : null),
        fetch('https://presence.roblox.com/v1/presence/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userIds: [USER_ID_NUM] })
        }).then(r => r.ok ? r.json() : null),
        fetch(`https://users.roblox.com/v1/users/${USER_ID}/username-history?limit=10&sortOrder=Desc`).then(r => r.ok ? r.json() : null),
        fetch(`https://groups.roblox.com/v1/users/${USER_ID}/groups/roles`).then(r => r.ok ? r.json() : null),
        fetch(`https://badges.roblox.com/v1/users/${USER_ID}/badges?limit=10&sortOrder=Desc`).then(r => r.ok ? r.json() : null),
      ]);

    const user = userR.status === 'fulfilled' ? userR.value : null;
    if (!user) throw new Error('User load failed');

    const avatarData   = avatarR.status   === 'fulfilled' ? avatarR.value   : null;
    const avatarUrl    = avatarData?.data?.[0]?.imageUrl ?? null;
    const friendsData  = friendsR.status  === 'fulfilled' ? friendsR.value  : null;
    const followersData= followersR.status=== 'fulfilled' ? followersR.value: null;
    const followingData= followingR.status=== 'fulfilled' ? followingR.value: null;
    const counts       = { friends: friendsData?.count ?? null, followers: followersData?.count ?? null, following: followingData?.count ?? null };
    const presenceData = presenceR.status === 'fulfilled' ? presenceR.value : null;
    const presence     = presenceData?.userPresences?.[0] ?? null;
    const prevNamesData= prevNamesR.status=== 'fulfilled' ? prevNamesR.value: null;
    const prevNames    = prevNamesData?.data?.map(d => d.name) ?? [];
    const groupsData   = groupsR.status   === 'fulfilled' ? groupsR.value   : null;
    const groups       = groupsData?.data ?? [];

    // Badges: fetch icons separately
    const badgesRaw    = badgesR.status   === 'fulfilled' ? badgesR.value   : null;
    const badgeList    = badgesRaw?.data ?? [];
    let badges = [];
    if (badgeList.length > 0) {
      const ids = badgeList.map(b => b.id).join(',');
      const thumbR = await fetch(`https://thumbnails.roblox.com/v1/badges/icons?badgeIds=${ids}&size=150x150&format=Png&isCircular=false`).then(r => r.ok ? r.json() : null).catch(() => null);
      const thumbMap = {};
      for (const t of thumbR?.data ?? []) { if (t.imageUrl) thumbMap[String(t.targetId)] = t.imageUrl; }
      badges = badgeList.map(b => ({
        id: b.id,
        name: b.displayName || b.name,
        game: b.creator?.name ?? null,
        imageUrl: thumbMap[String(b.id)] ?? null,
      }));
    }

    showProfile(user, avatarUrl, counts, presence, prevNames, groups, badges);
  } catch {
    showError('Could not load Roblox profile. Please try again.');
  } finally {
    btn.disabled = false;
    icon.style.animation = '';
    label.textContent = 'Refresh';
  }
}

loadProfile();
</script>
